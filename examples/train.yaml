# Settings of one training run. Everything outside the "authtracker:" block is saved as parameters.
authtracker:                 # where the run belongs (arguments to at.init(...) override these)
  model: churn
  experiment: gradient-boosting
  tags:
    team: ml-platform
task: binary-classification
optimizer:
  name: gradient-boosting
  learning_rate: 0.1
  n_estimators: 50
split: {train: 0.7, test: 0.3}
