name: Release

# On every push to main that changes the package source: test, bump the patch
# version, tag it, and publish to PyPI. Needs the repository secret PYPI_API_TOKEN.
on:
  push:
    branches: [main]
    paths:
      - "src/authtracker/**"
  workflow_dispatch:

# One release at a time, so two quick merges can't race on the version number.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write   # push the version bump commit and the tag

jobs:
  release:
    # Safety net against loops: never run for the bot's own bump commit.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip                          # reuse downloaded wheels (MLflow, W&B, scikit-learn, torch) between runs
          cache-dependency-path: pyproject.toml

      - name: Test
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # CPU-only PyTorch, so the bundle tests run instead of being skipped
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pytest -q -n auto -m "not slow"   # in parallel, one worker per CPU; the slow end-to-end tests run locally

      - name: Bump patch version
        id: bump
        run: |
          f=src/authtracker/__init__.py
          cur=$(sed -nE 's/^__version__ = "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' "$f")
          [ -n "$cur" ] || { echo "version not found in $f"; exit 1; }
          IFS=. read -r maj min pat <<< "$cur"
          new="$maj.$min.$((pat + 1))"
          if git rev-parse -q --verify "refs/tags/$new" >/dev/null; then
            echo "tag $new already exists"; exit 1
          fi
          sed -i -E "s/^__version__ = \".*\"$/__version__ = \"$new\"/" "$f"
          echo "version=$new" >> "$GITHUB_OUTPUT"
          echo "Bumping $cur -> $new"

      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*

      - name: Commit and tag
        run: |
          v=${{ steps.bump.outputs.version }}
          prev=$(git describe --tags --abbrev=0 2>/dev/null || true)

          # Release notes = commit subjects since the previous tag (bot commits excluded).
          {
            echo "## What's changed"
            echo
            git log ${prev:+$prev..HEAD} --no-merges --invert-grep --grep='^chore: release' \
              --pretty='- %s (%h)'
            if [ -n "$prev" ]; then
              echo
              echo "**Full changelog:** ${{ github.server_url }}/${{ github.repository }}/compare/$prev...$v"
            fi
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/authtracker/__init__.py
          git commit -m "chore: release $v [skip ci]"
          git tag -a "$v" -m "authtracker $v" -m "$(cat RELEASE_NOTES.md)"
          # --atomic: the branch and the tag both land or neither does, so a push to main that races this
          # run cannot leave a tag behind without its release commit
          git push --atomic origin HEAD:main "$v"

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload --skip-existing dist/*

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.bump.outputs.version }}" dist/* --notes-file RELEASE_NOTES.md --title "${{ steps.bump.outputs.version }}"
